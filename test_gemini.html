<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Gemini API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .output {
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 600px;
            overflow-y: auto;
        }
        .success {
            border-left-color: #10b981;
            background: #f0fdf4;
        }
        .error {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        .info {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3b82f6;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Gemini API</h1>
        <p class="subtitle">Kiểm tra Gemini API có hoạt động không</p>
        
        <div class="info">
            <strong>API Key:</strong> AIzaSyA7hoT0G1-GKVycNqFYVKNK855fDNGUDkY<br>
            <strong>Model:</strong> gemini-2.0-flash
        </div>

        <div class="input-group">
            <label for="testInput">Test Input (mô phỏng kết quả từ model):</label>
            <textarea id="testInput">Trust Score: 66/100
Verdict: needs-review
Summary: semantic similarity 0.79; authority score 30; trusted domain: baotintuc.vn; trusted domain: dantri.com.vn
Flags: ai, authority, clickbait, donation, event, fact-check, media, safety, semantic-medium, signals, single-source, spam-behavior, speculative, temporal, translation, typosquatting, uniqueness</textarea>
        </div>

        <button onclick="testSimple()">Test Simple</button>
        <button onclick="testBeautify()">Test Beautify (như extension)</button>
        <button onclick="clearOutput()">Clear</button>

        <div id="output" class="output" style="display: none;"></div>
    </div>

    <script>
        const API_KEY = 'AIzaSyA7hoT0G1-GKVycNqFYVKNK855fDNGUDkY';
        const API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent';

        function showOutput(text, type = '') {
            const output = document.getElementById('output');
            output.style.display = 'block';
            output.className = 'output ' + type;
            output.textContent = text;
        }

        async function testSimple() {
            showOutput('Đang test...', 'info');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'x-goog-api-key': API_KEY,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ 
                                text: 'Trả về JSON: {"message": "Hello from Gemini", "status": "success"}' 
                            }]
                        }]
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API Error ${response.status}: ${errorText}`);
                }

                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

                showOutput(
                    '✅ SUCCESS!\n\n' +
                    'Status: ' + response.status + '\n' +
                    'Response:\n' + JSON.stringify(result, null, 2) + '\n\n' +
                    'Extracted Text:\n' + text,
                    'success'
                );
            } catch (error) {
                showOutput('❌ ERROR:\n\n' + error.message, 'error');
            }
        }

        async function testBeautify() {
            const input = document.getElementById('testInput').value;
            showOutput('Đang test beautify với Gemini...', 'info');

            const flagMap = {
                'ai': 'Có dấu hiệu nội dung AI tạo ra',
                'authority': 'Độ uy tín của nguồn chưa cao',
                'clickbait': 'Tiêu đề câu view, giật gân',
                'donation': 'Có yêu cầu quyên góp đáng ngờ',
                'event': 'Sự kiện chưa được xác minh',
                'fact-check': 'Cần kiểm chứng thông tin',
                'media': 'Hình ảnh/video có vấn đề',
                'safety': 'Có nguy cơ an toàn',
                'semantic-medium': 'Độ tương đồng ngữ nghĩa trung bình',
                'signals': 'Có nhiều dấu hiệu đáng ngờ',
                'single-source': 'Chỉ có một nguồn duy nhất',
                'spam-behavior': 'Có hành vi spam',
                'speculative': 'Nội dung mang tính suy đoán',
                'temporal': 'Thông tin lỗi thời',
                'translation': 'Bản dịch có vấn đề',
                'typosquatting': 'Domain giả mạo',
                'uniqueness': 'Nội dung thiếu tính độc đáo'
            };

            const flags = ['ai', 'authority', 'clickbait', 'single-source', 'spam-behavior'];
            const flagsExplanation = flags.map(f => flagMap[f] || f);

            const prompt = `Bạn là chuyên gia phân tích tin tức. Hãy VIẾT LẠI kết quả phân tích dưới đây thành ngôn ngữ TẰ NHIÊN, DỄ HIỂU cho người đọc thông thường.

📊 DỮ LIỆU PHÂN TÍCH:
${input}

Các vấn đề đã chuyển sang tiếng Việt:
${flagsExplanation.join('\n')}

🎯 YÊU CẦU VIẾT LẠI:
1. SUMMARY: Viết 2-3 câu TỰ NHIÊN giải thích điểm tin cậy và kết luận
2. DETAILED_ANALYSIS: Viết 4-5 đoạn PHÂN TÍCH CHI TIẾT với các tiêu đề rõ ràng
3. FLAGS: Chuyển các cảnh báo kỹ thuật thành NGÔN NGỮ DỄ HIỂU
4. ACTION_SUGGESTION: Đưa ra lời khuyên CỤ THỂ cho người đọc

Trả về JSON (KHÔNG dùng markdown, chỉ JSON thuần):
{
  "summary": "Viết tóm tắt tự nhiên ở đây",
  "detailed_analysis": "Viết phân tích chi tiết ở đây, dùng \\n\\n để ngắt đoạn",
  "flags": ["Cảnh báo 1", "Cảnh báo 2"],
  "action_suggestion": "Lời khuyên cụ thể cho người đọc"
}`;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'x-goog-api-key': API_KEY,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API Error ${response.status}: ${errorText}`);
                }

                const result = await response.json();
                console.log('Full response:', result);
                
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

                // Try to extract JSON
                let jsonMatch = text.match(/\{[\s\S]*\}/);
                
                if (!jsonMatch) {
                    const codeBlockMatch = text.match(/```(?:json)?\s*\n?([\s\S]*?)\n?```/);
                    if (codeBlockMatch) {
                        jsonMatch = [codeBlockMatch[1]];
                    }
                }

                if (jsonMatch) {
                    const beautified = JSON.parse(jsonMatch[0]);
                    showOutput(
                        '✅ BEAUTIFY SUCCESS!\n\n' +
                        '=== SUMMARY ===\n' + beautified.summary + '\n\n' +
                        '=== DETAILED ANALYSIS ===\n' + beautified.detailed_analysis + '\n\n' +
                        '=== FLAGS ===\n' + beautified.flags.join('\n') + '\n\n' +
                        '=== ACTION SUGGESTION ===\n' + beautified.action_suggestion + '\n\n' +
                        '=== RAW JSON ===\n' + JSON.stringify(beautified, null, 2),
                        'success'
                    );
                } else {
                    showOutput(
                        '⚠️ NO JSON FOUND\n\n' +
                        'Raw response text:\n' + text,
                        'error'
                    );
                }
            } catch (error) {
                showOutput('❌ ERROR:\n\n' + error.message + '\n\n' + error.stack, 'error');
            }
        }

        function clearOutput() {
            document.getElementById('output').style.display = 'none';
        }
    </script>
</body>
</html>
